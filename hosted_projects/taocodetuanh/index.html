<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCode AI Promax | Image to Code</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Highlight.js for Code Formatting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Cấu hình màu tùy chỉnh cho Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0f111a',
                            800: '#1a1d27',
                            700: '#2b2f40'
                        },
                        primary: '#6366f1'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f111a; color: #e2e8f0; }
        .glass-panel { background: rgba(26, 29, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        pre code.hljs { border-radius: 0.75rem; padding: 1.5rem; background: #12141c !important; }
        
        /* Hiệu ứng loading viền gradient */
        .loading-border {
            position: relative;
        }
        .loading-border::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 0.85rem;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #ec4899, #3b82f6);
            background-size: 400%;
            z-index: -1;
            animation: gradient-spin 3s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .loading-border.active::before { opacity: 1; }
        @keyframes gradient-spin { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="glass-panel sticky top-0 z-50 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg">
                    <i class="ph-fill ph-magic-wand text-white text-xl"></i>
                </div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">
                    AutoCode AI <span class="text-sm font-medium text-gray-400 ml-1">Promax</span>
                </h1>
            </div>
            <div id="status-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-red-500/10 text-red-400 text-sm font-medium border border-red-500/20">
                <i class="ph-fill ph-warning-circle"></i> Chưa kết nối Server
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col lg:flex-row gap-6">
        
        <!-- Cột Trái: Input Controls -->
        <div class="w-full lg:w-1/3 flex flex-col gap-5">
            <!-- Khu vực tải ảnh -->
            <div class="glass-panel rounded-2xl p-5 loading-border" id="upload-container">
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i class="ph ph-image"></i> Hình ảnh UI
                </h2>
                
                <input type="file" id="file-upload" class="hidden" accept="image/*" />
                <label for="file-upload" id="drop-zone" class="cursor-pointer border-2 border-dashed border-gray-700 hover:border-indigo-500 rounded-xl bg-dark-900/50 flex flex-col items-center justify-center p-8 transition-colors relative overflow-hidden group">
                    <!-- Ảnh Preview sẽ đè lên trên nếu có -->
                    <img id="image-preview" class="absolute inset-0 w-full h-full object-contain hidden bg-dark-900 z-10" />
                    
                    <div class="z-0 flex flex-col items-center text-center">
                        <i class="ph-duotone ph-upload-simple text-4xl text-indigo-400 mb-3 group-hover:-translate-y-1 transition-transform"></i>
                        <p class="text-sm text-gray-300 font-medium">Click hoặc Kéo thả ảnh vào đây</p>
                        <p class="text-xs text-gray-500 mt-1">Hỗ trợ PNG, JPG, WebP</p>
                    </div>
                    
                    <!-- Nút xóa ảnh -->
                    <button type="button" id="btn-remove-image" class="absolute top-2 right-2 bg-red-500/80 text-white w-8 h-8 rounded-full z-20 hidden items-center justify-center hover:bg-red-500 transition-colors backdrop-blur">
                        <i class="ph ph-x"></i>
                    </button>
                </label>
            </div>

            <!-- Khu vực Cấu hình -->
            <div class="glass-panel rounded-2xl p-5">
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i class="ph ph-gear"></i> Cấu hình
                </h2>
                
                <!-- Model Selector -->
                <div class="mb-4">
                    <label class="block text-xs text-gray-400 mb-1.5 ml-1">AI Model (Tự động tải)</label>
                    <div class="relative">
                        <select id="model-select" class="w-full bg-dark-900 border border-gray-700 text-gray-200 text-sm rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block p-3 appearance-none cursor-pointer">
                            <option value="">Đang tải danh sách models...</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                            <i class="ph ph-caret-down"></i>
                        </div>
                    </div>
                </div>

                <!-- Custom Prompt -->
                <div class="mb-5">
                    <label class="block text-xs text-gray-400 mb-1.5 ml-1">Yêu cầu bổ sung (Tùy chọn)</label>
                    <textarea id="custom-prompt" rows="3" class="w-full bg-dark-900 border border-gray-700 text-gray-200 text-sm rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block p-3 resize-none" placeholder="VD: Hãy dùng React thay vì HTML, thêm hiệu ứng hover cho các nút..."></textarea>
                </div>

                <!-- Generate Button -->
                <button id="btn-generate" class="w-full relative overflow-hidden bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-500/20 transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed group">
                    <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
                    <i id="btn-icon" class="ph-fill ph-lightning text-lg"></i>
                    <span id="btn-text">Bắt đầu Tạo Code</span>
                </button>
            </div>
        </div>

        <!-- Cột Phải: Trình Editor Code -->
        <div class="w-full lg:w-2/3 flex flex-col">
            <div class="glass-panel rounded-2xl flex flex-col h-[calc(100vh-140px)] min-h-[500px]">
                
                <!-- Toolbar Editor -->
                <div class="flex items-center justify-between p-3 border-b border-gray-800 bg-dark-800/50 rounded-t-2xl">
                    <div class="flex gap-2">
                        <!-- Mac OS style dots -->
                        <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                        <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
                    </div>
                    
                    <div class="flex gap-2">
                        <button id="btn-copy" class="flex items-center gap-1.5 text-xs font-medium text-gray-400 hover:text-white bg-dark-900 px-3 py-1.5 rounded-lg border border-gray-700 transition-colors">
                            <i class="ph ph-copy"></i> Copy Code
                        </button>
                        <button id="btn-preview" class="flex items-center gap-1.5 text-xs font-medium text-indigo-400 hover:text-indigo-300 bg-indigo-500/10 px-3 py-1.5 rounded-lg border border-indigo-500/20 transition-colors">
                            <i class="ph ph-eye"></i> Xem trước
                        </button>
                        <button id="btn-download" class="flex items-center gap-1.5 text-xs font-medium text-gray-400 hover:text-white bg-dark-900 px-3 py-1.5 rounded-lg border border-gray-700 transition-colors">
                            <i class="ph ph-download-simple"></i> Lưu .html
                        </button>
                    </div>
                </div>

                <!-- Code Content -->
                <div class="flex-grow overflow-auto relative p-1 bg-[#12141c] rounded-b-2xl">
                    <!-- Overlay trạng thái trống -->
                    <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 z-10 bg-[#12141c]">
                        <i class="ph-duotone ph-code text-6xl mb-4 opacity-50"></i>
                        <p>Code HTML/CSS/JS sẽ xuất hiện ở đây.</p>
                    </div>
                    
                    <pre id="code-container" class="m-0 h-full scrollbar-hide text-sm leading-relaxed"><code id="code-output" class="language-html h-full block"></code></pre>
                    <!-- Iframe dùng để hiển thị giao diện Web được tạo ra -->
                    <iframe id="preview-frame" class="w-full h-full bg-white hidden border-0 rounded-b-xl"></iframe>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 flex flex-col gap-3 z-50"></div>

    <script>
        // Các DOM Elements
        const statusBadge = document.getElementById('status-badge');
        const modelSelect = document.getElementById('model-select');
        const fileInput = document.getElementById('file-upload');
        const dropZone = document.getElementById('drop-zone');
        const imagePreview = document.getElementById('image-preview');
        const btnRemoveImage = document.getElementById('btn-remove-image');
        const btnGenerate = document.getElementById('btn-generate');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const codeOutput = document.getElementById('code-output');
        const codeContainer = document.getElementById('code-container');
        const previewFrame = document.getElementById('preview-frame');
        const btnPreview = document.getElementById('btn-preview');
        const emptyState = document.getElementById('empty-state');
        const uploadContainer = document.getElementById('upload-container');
        const customPrompt = document.getElementById('custom-prompt');

        let currentFile = null;
        let generatedCodeStr = "";
        let isPreviewMode = false;

        // 1. Tải danh sách Models khi vừa mở trang
        async function fetchModels() {
            try {
                const response = await fetch('/api/models');
                if (!response.ok) throw new Error('Server không phản hồi');
                
                const data = await response.json();
                
                if (data.error) {
                    showToast('Lỗi Cấu Hình: ' + data.error, 'error');
                    statusBadge.innerHTML = '<i class="ph-fill ph-x-circle"></i> Lỗi API Key';
                    statusBadge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full bg-red-500/10 text-red-400 text-sm font-medium border border-red-500/20';
                    return;
                }

                // Render options
                modelSelect.innerHTML = '';
                data.models.forEach(m => {
                    const option = document.createElement('option');
                    option.value = m.name;
                    option.textContent = m.display;
                    modelSelect.appendChild(option);
                });

                statusBadge.innerHTML = '<i class="ph-fill ph-check-circle"></i> Đã kết nối Server';
                statusBadge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full bg-green-500/10 text-green-400 text-sm font-medium border border-green-500/20';
            } catch (error) {
                console.error(error);
                showToast('Không thể kết nối đến Web Server (Flask).', 'error');
            }
        }

        // 2. Xử lý tải ảnh và kéo thả
        function handleFile(file) {
            if (file && file.type.startsWith('image/')) {
                currentFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.src = e.target.result;
                    imagePreview.classList.remove('hidden');
                    btnRemoveImage.classList.remove('hidden');
                    btnRemoveImage.classList.add('flex');
                };
                reader.readAsDataURL(file);
            } else {
                showToast('Vui lòng chọn một file hình ảnh (PNG, JPG, WebP).', 'error');
            }
        }

        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-indigo-500', 'bg-indigo-500/10');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-indigo-500', 'bg-indigo-500/10');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'bg-indigo-500/10');
            handleFile(e.dataTransfer.files[0]);
        });

        btnRemoveImage.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            currentFile = null;
            fileInput.value = '';
            imagePreview.src = '';
            imagePreview.classList.add('hidden');
            btnRemoveImage.classList.add('hidden');
            btnRemoveImage.classList.remove('flex');
        });

        // 3. Xử lý nút Generate Code
        btnGenerate.addEventListener('click', async () => {
            if (!currentFile) {
                showToast('Vui lòng tải lên một hình ảnh UI trước!', 'warning');
                return;
            }

            // UI Loading state
            btnGenerate.disabled = true;
            btnText.textContent = 'Đang phân tích (10-20s)...';
            btnIcon.className = 'ph ph-spinner animate-spin text-lg';
            uploadContainer.classList.add('active'); // Bật viền gradient chạy

            const formData = new FormData();
            formData.append('image', currentFile);
            formData.append('model', modelSelect.value);
            formData.append('prompt', customPrompt.value);

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showToast(data.error, 'error');
                } else {
                    // Thành công
                    showToast('Đã tạo Code thành công!', 'success');
                    generatedCodeStr = data.code;
                    
                    // Ẩn state rỗng, hiển thị code
                    emptyState.classList.add('hidden');
                    
                    // Nếu đang mở tab xem trước, cập nhật luôn nội dung hiển thị
                    if (isPreviewMode) {
                        previewFrame.srcdoc = generatedCodeStr;
                    }
                    
                    // Sử dụng Highlight.js để format
                    codeOutput.textContent = generatedCodeStr;
                    // Bỏ class cũ của highlightjs nếu có
                    codeOutput.className = 'language-html block h-full'; 
                    hljs.highlightElement(codeOutput);
                }
            } catch (error) {
                console.error(error);
                showToast('Lỗi mạng khi gọi API.', 'error');
            } finally {
                // Khôi phục UI
                btnGenerate.disabled = false;
                btnText.textContent = 'Bắt đầu Tạo Code';
                btnIcon.className = 'ph-fill ph-lightning text-lg';
                uploadContainer.classList.remove('active');
            }
        });

        // 4. Các nút tiện ích (Copy, Download)
        document.getElementById('btn-copy').addEventListener('click', () => {
            if (!generatedCodeStr) {
                showToast('Chưa có code để copy!', 'warning');
                return;
            }
            navigator.clipboard.writeText(generatedCodeStr).then(() => {
                showToast('Đã copy code vào Clipboard!', 'success');
            });
        });

        document.getElementById('btn-download').addEventListener('click', () => {
            if (!generatedCodeStr) {
                showToast('Chưa có code để tải về!', 'warning');
                return;
            }
            const blob = new Blob([generatedCodeStr], { type: 'text/html' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'autocode_result.html';
            a.click();
            window.URL.revokeObjectURL(url);
        });

        // Xử lý nút Xem trước / Xem Code
        btnPreview.addEventListener('click', () => {
            if (!generatedCodeStr) {
                showToast('Chưa có code để xem trước!', 'warning');
                return;
            }
            
            isPreviewMode = !isPreviewMode;
            
            if (isPreviewMode) {
                // Chuyển sang chế độ Xem trước giao diện (Render HTML)
                codeContainer.classList.add('hidden');
                previewFrame.classList.remove('hidden');
                previewFrame.srcdoc = generatedCodeStr;
                
                // Cập nhật nút sang trạng thái "Xem Code" (Màu xanh lá)
                btnPreview.innerHTML = '<i class="ph ph-code"></i> Xem Code';
                btnPreview.classList.replace('text-indigo-400', 'text-emerald-400');
                btnPreview.classList.replace('bg-indigo-500/10', 'bg-emerald-500/10');
                btnPreview.classList.replace('border-indigo-500/20', 'border-emerald-500/20');
            } else {
                // Chuyển về chế độ hiển thị Text Code
                previewFrame.classList.add('hidden');
                codeContainer.classList.remove('hidden');
                
                // Trả nút về trạng thái "Xem trước" (Màu tím nhạt)
                btnPreview.innerHTML = '<i class="ph ph-eye"></i> Xem trước';
                btnPreview.classList.replace('text-emerald-400', 'text-indigo-400');
                btnPreview.classList.replace('bg-emerald-500/10', 'bg-indigo-500/10');
                btnPreview.classList.replace('border-emerald-500/20', 'border-indigo-500/20');
            }
        });

        // 5. Hệ thống Toast Notification (thay thế cho alert)
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            
            // Set màu sắc theo loại
            let bgColor, iconClass, textColor;
            if (type === 'success') {
                bgColor = 'bg-dark-800'; textColor = 'text-green-400'; iconClass = 'ph-fill ph-check-circle';
            } else if (type === 'error') {
                bgColor = 'bg-red-500/10 border-red-500/20 border'; textColor = 'text-red-400'; iconClass = 'ph-fill ph-warning-circle';
            } else {
                bgColor = 'bg-yellow-500/10 border-yellow-500/20 border'; textColor = 'text-yellow-400'; iconClass = 'ph-fill ph-info';
            }

            toast.className = `${bgColor} p-4 rounded-xl shadow-xl flex items-center gap-3 transform transition-all duration-300 translate-y-10 opacity-0 min-w-[300px] border border-gray-700`;
            toast.innerHTML = `
                <i class="${iconClass} text-xl ${textColor}"></i>
                <p class="text-sm font-medium text-gray-200">${message}</p>
            `;

            document.getElementById('toast-container').appendChild(toast);

            // Animate in
            setTimeout(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            }, 10);

            // Tự động xóa sau 3.5s
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-10');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Khởi động
        window.addEventListener('DOMContentLoaded', fetchModels);
    </script>
</body>
</html>
