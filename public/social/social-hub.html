<!DOCTYPE html>
<html lang="vi" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D4M Social Hub | Connect & Share</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #000000; --accent: #ff0050; --accent-hover: #cc0040; --ig-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        body { background-color: var(--bg-dark); color: #ffffff; font-family: 'Inter', sans-serif; overflow-x: hidden; min-height: 100vh; }
        
        /* 📜 Scrollbar xịn */
        ::-webkit-scrollbar { width: 0px; background: transparent; } /* Giấu hẳn thanh cuộn để ngầu như App Mobile */
        
        /* 🃏 Glass Card (Insta Style) */
        .post-card { background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding: 1.5rem 0; transition: background 0.3s; }
        .post-card:hover { background: rgba(30, 30, 30, 0.8); }

        /* 🌈 Vòng sáng Avatar kiểu Story */
        .story-ring { padding: 2px; background: var(--ig-gradient); border-radius: 50%; }
        .story-ring img { border: 2px solid var(--bg-dark); }

        /* 🎵 Custom Audio Player */
        .custom-audio-player { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px; display: flex; align-items: center; gap: 12px; }
        .play-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--ig-gradient); display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 15px rgba(220, 39, 67, 0.4); }
        .play-btn:active { transform: scale(0.9); }
        .progress-bar-container { flex-grow: 1; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; cursor: pointer; position: relative; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s linear; }
        
        /* 📱 Mobile Input Fix */
        .glass-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 999px; padding: 12px 20px; outline: none; transition: all 0.3s; }
        .glass-input:focus { border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); }

        /* Thùng rác hiện lên mượt mà */
        .delete-btn { opacity: 0; transform: scale(0.8); transition: all 0.2s ease; }
        .post-card:hover .delete-btn { opacity: 1; transform: scale(1); }

        /* Toast Alert */
        @keyframes toast-slide { 0% { transform: translateY(100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        .toast-enter { animation: toast-slide 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="flex justify-center">

    <!-- 🍞 TOAST CONTAINER -->
    <div id="toast-container" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

    <!-- 🛑 LOGIN MODAL -->
    <div id="loginModal" class="fixed inset-0 bg-black/90 backdrop-blur-xl z-[100] flex items-center justify-center hidden">
        <div class="p-8 max-w-sm w-full mx-4 text-center animate-[fadeIn_0.5s_ease-out]">
            <div class="w-20 h-20 mx-auto rounded-full bg-gradient-to-tr from-[#f09433] via-[#dc2743] to-[#bc1888] flex items-center justify-center shadow-[0_0_40px_rgba(220,39,67,0.5)] mb-6">
                <i class="fa-solid fa-camera-retro text-3xl text-white"></i>
            </div>
            <h2 class="text-2xl font-black text-white mb-2 tracking-wide font-[Outfit]">D4M Social Hub</h2>
            <p class="text-sm text-gray-400 mb-8">Khu vực giao lưu nội bộ.<br>Nhập biệt danh của bạn để bắt đầu chém gió!</p>
            
            <input type="text" id="guestName" placeholder="Tên hiển thị của sếp là gì?" class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-white text-center font-bold focus:border-[#dc2743] focus:bg-white/10 outline-none mb-4 transition" onkeypress="if(event.key === 'Enter') handleLogin()">
            <button onclick="handleLogin()" class="w-full py-4 bg-white text-black hover:bg-gray-200 rounded-2xl font-black uppercase tracking-widest transition shadow-lg active:scale-95">Tham Gia Ngay</button>
            <p class="text-[10px] text-gray-600 mt-6 uppercase tracking-widest"><i class="fa-solid fa-lock mr-1"></i> Không lưu trữ dữ liệu cá nhân</p>
        </div>
    </div>

    <!-- 📱 MAIN APP CONTAINER (Giao diện giống ĐT) -->
    <div class="w-full max-w-xl min-h-screen border-x border-white/5 relative bg-black">
        
        <!-- 🌌 HEADER (TOP BAR) -->
        <header class="flex items-center justify-between py-4 px-5 border-b border-white/10 sticky top-0 bg-black/80 backdrop-blur-xl z-50">
            <h1 class="text-xl font-black tracking-widest font-[Outfit] text-white flex items-center gap-2">
                D4M <i class="fa-solid fa-circle-check text-blue-500 text-[14px]"></i>
            </h1>
            <div class="flex items-center gap-4">
                <div id="authControls" class="flex gap-4 items-center">
                    <button class="text-gray-200 hover:text-white text-xl transition"><i class="fa-regular fa-heart"></i></button>
                    <button class="text-gray-200 hover:text-white text-xl transition"><i class="fa-brands fa-facebook-messenger"></i></button>
                    <!-- Nút Logout (Ẩn giấu) -->
                    <button onclick="logout()" class="text-red-500 hover:text-red-400 text-sm ml-2" title="Đăng xuất"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>
        </header>

        <!-- ✍️ POST CREATE AREA -->
        <div id="postArea" class="p-5 border-b border-white/10 hidden bg-gradient-to-b from-white/5 to-transparent">
            <div class="flex gap-3">
                <div class="story-ring flex-shrink-0 w-11 h-11"><img id="postAvatar" src="https://via.placeholder.com/150" class="w-full h-full rounded-full object-cover"></div>
                <div class="flex-1 pt-1">
                    <div class="flex items-center gap-1 font-bold text-sm text-white mb-1"><span id="currentUserName">Sếp</span></div>
                    <textarea id="postContent" rows="2" class="w-full bg-transparent text-white placeholder-gray-500 text-sm resize-none outline-none leading-relaxed" placeholder="Chia sẻ suy nghĩ hoặc bài hát sếp đang nghe..."></textarea>
                    
                    <!-- Box hiển thị nhạc đính kèm -->
                    <div id="mediaAttachmentBox" class="hidden mt-2 p-2 bg-white/5 rounded-xl border border-white/10 flex items-center justify-between transition-all">
                        <div class="flex items-center gap-2 truncate">
                            <div class="w-8 h-8 rounded bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center"><i class="fa-solid fa-music text-white text-xs"></i></div>
                            <span id="attachedMediaName" class="text-xs font-bold text-gray-200 truncate">Đã chọn...</span>
                        </div>
                        <button onclick="removeMedia()" class="text-gray-500 hover:text-red-500 w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                    </div>

                    <div class="flex items-center justify-between mt-3 pt-3 border-t border-white/5 relative">
                        <div class="flex gap-4 text-xl">
                            <!-- Nút Thêm Nhạc -->
                            <div class="relative">
                                <button onclick="toggleMusicDropdown()" class="text-gray-400 hover:text-white transition"><i class="fa-solid fa-music"></i></button>
                                <!-- Khung thả chọn nhạc -->
                                <div id="musicDropdown" class="hidden absolute top-8 left-0 w-64 max-h-56 overflow-y-auto custom-scrollbar bg-[#1c1c1c] border border-white/10 rounded-2xl shadow-2xl z-50 p-2">
                                    <div class="text-[10px] font-bold text-gray-500 mb-2 px-2 uppercase tracking-wider">Kho nhạc D4M Cloud</div>
                                    <div id="musicListDropdown" class="flex flex-col gap-1"></div>
                                </div>
                            </div>
                            <button class="text-gray-400 hover:text-white transition cursor-not-allowed" title="Up Ảnh (Coming Soon)"><i class="fa-regular fa-image"></i></button>
                        </div>
                        <button onclick="submitPost()" class="px-5 py-1.5 bg-white text-black rounded-full text-xs font-black uppercase hover:bg-gray-200 transition active:scale-95">Đăng</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 📜 FEED BẢNG TIN -->
        <div id="feedContainer" class="flex flex-col pb-20 relative z-10 w-full">
            <!-- Shimmer Loading -->
            <div class="p-5 flex gap-3 animate-pulse border-b border-white/5"><div class="w-10 h-10 bg-gray-800 rounded-full"></div><div class="flex-1 space-y-2"><div class="h-3 bg-gray-800 rounded w-1/3"></div><div class="h-3 bg-gray-800 rounded w-full"></div><div class="h-3 bg-gray-800 rounded w-2/3"></div></div></div>
        </div>
        
    </div>

    <!-- TẠO ĐỐI TƯỢNG TRÌNH PHÁT NHẠC ẢO (Vô Hình) -->
    <audio id="globalAudioPlayer" src="" preload="auto"></audio>

    <script>
                // ===================================
        // 🚀 LÕI JAVASCRIPT CHUẨN SSO (DATABASE REAL)
        // ===================================
        let availableMedia = [];
        let selectedMediaData = null;
        let currentlyPlayingPostId = null;
        let currentUser = null;

        // 1. CÔNG CỤ XÁC THỰC
        function getAuthToken() { return localStorage.getItem('d4m_sso_token'); }
        function getApiHeaders() { return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getAuthToken()}` }; }
        function redirectToAuth() { window.location.href = `/auth?redirect=${window.location.pathname}`; }
        function logout() { localStorage.removeItem('d4m_sso_token'); redirectToAuth(); }

        function parseJwt(token) {
            if(!token) return null;
            try { return JSON.parse(decodeURIComponent(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''))); } 
            catch (e) { return null; }
        }

        // 2. KHÓA CỬA AN NINH
        function checkAuthorization() {
            const token = getAuthToken();
            const lockModal = document.getElementById('loginModal'); // Ta tận dụng lại khung modal cũ làm Lock Screen
            const postArea = document.getElementById('postArea');

            if (!token) {
                lockModal.innerHTML = `<div class="p-8 max-w-sm w-full mx-4 text-center bg-black/80 rounded-3xl border border-red-500/30 backdrop-blur-xl"><i class="fa-solid fa-fingerprint text-6xl text-red-500 mb-4 animate-pulse"></i><h2 class="text-2xl font-black text-white mb-2 uppercase">Chưa Xác Thực</h2><p class="text-sm text-gray-400 mb-6">Mạng xã hội nội bộ yêu cầu thẻ D4M ID.</p><button onclick="redirectToAuth()" class="w-full py-4 bg-gradient-to-r from-red-600 to-red-800 text-white font-black uppercase rounded-2xl transition shadow-[0_0_15px_rgba(239,68,68,0.4)] active:scale-95">Đăng Nhập Ngay</button></div>`;
                lockModal.classList.remove('hidden'); postArea.classList.add('hidden');
                return false;
            }

            const payload = parseJwt(token);
            if (!payload || (payload.exp && payload.exp * 1000 < Date.now()) || payload.active !== 1) {
                lockModal.innerHTML = `<div class="p-8 max-w-sm w-full mx-4 text-center bg-black/80 rounded-3xl border border-yellow-500/30 backdrop-blur-xl"><i class="fa-solid fa-triangle-exclamation text-6xl text-yellow-500 mb-4 animate-pulse"></i><h2 class="text-2xl font-black text-white mb-2 uppercase">Lỗi Định Danh</h2><p class="text-sm text-gray-400 mb-6">Thẻ D4M ID hết hạn hoặc chưa kích hoạt.</p><button onclick="logout()" class="w-full py-4 bg-yellow-600 text-white font-black uppercase rounded-2xl transition shadow-[0_0_15px_rgba(234,179,8,0.4)] active:scale-95">Đăng Nhập Lại</button></div>`;
                lockModal.classList.remove('hidden'); postArea.classList.add('hidden');
                return false;
            }

            // Vượt qua kiểm tra -> Mở giao diện
            currentUser = {
                id: payload.user_id, role: payload.role, username: payload.sub,
                fullname: payload.full_name || payload.sub, avatar_url: payload.avatar_url
            };

            lockModal.classList.add('hidden');
            postArea.classList.remove('hidden');
            document.getElementById("currentUserName").innerText = currentUser.fullname;
            if(document.getElementById("postAvatar") && currentUser.avatar_url) document.getElementById("postAvatar").src = currentUser.avatar_url;
            
            return true;
        }

        // ===================================
        // GIAO DIỆN & TIỆN ÍCH (UI/UX)
        // ===================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-black/90' : 'bg-red-900/90';
            toast.className = `px-5 py-3 rounded-full border border-white/10 ${bg} backdrop-blur-md shadow-2xl toast-enter flex items-center gap-2 pointer-events-auto text-sm font-medium text-white mb-2`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-green-400' : 'fa-circle-exclamation text-red-400'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.transform = 'translateY(100%)'; toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function formatTimeAgo(dateString) {
            const date = new Date(dateString); const now = new Date(); const diff = Math.floor((now - date) / 1000);
            if(diff < 60) return `${diff}s`; if(diff < 3600) return `${Math.floor(diff/60)}m`; if(diff < 86400) return `${Math.floor(diff/3600)}h`; return `${Math.floor(diff/86400)}d`;
        }

        function renderVerifiedBadge(role) { return Number(role) === 1 ? '<i class="fa-solid fa-circle-check text-blue-500 text-[12px] ml-1" title="D4M Admin"></i>' : ''; }

        // ===================================
        // 🎼 QUẢN LÝ NHẠC VÀ ĐĂNG BÀI 
        // ===================================
        async function loadMusicLibrary() {
            try {
                const res = await fetch('/api/music/list', { headers: getApiHeaders() });
                if(res.ok) {
                    const data = await res.json();
                    availableMedia = data.songs || [];
                    const dropdown = document.getElementById("musicListDropdown"); dropdown.innerHTML = "";
                    availableMedia.forEach(song => {
                        dropdown.innerHTML += `<button onclick="selectMedia('${song.id}')" class="text-left px-3 py-2.5 hover:bg-white/10 rounded-xl text-xs flex items-center gap-3 transition w-full"><div class="w-8 h-8 rounded bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center flex-shrink-0"><i class="fa-solid ${song.flags.video ? 'fa-video' : 'fa-music'} text-white text-[10px]"></i></div><div class="truncate"><div class="font-bold text-gray-200 truncate">${song.title}</div><div class="text-[10px] text-gray-500">${song.artist || 'D4M Studio'}</div></div></button>`;
                    });
                }
            } catch (e) {}
        }

        function toggleMusicDropdown() { document.getElementById("musicDropdown").classList.toggle("hidden"); }
        function removeMedia() { selectedMediaData = null; document.getElementById("mediaAttachmentBox").classList.add("hidden"); }
        window.selectMedia = function(songId) {
            selectedMediaData = availableMedia.find(s => s.id === songId);
            document.getElementById("attachedMediaName").innerText = selectedMediaData.title + (selectedMediaData.flags.video ? " (Video)" : " (Audio)");
            document.getElementById("mediaAttachmentBox").classList.remove("hidden");
            document.getElementById("musicDropdown").classList.add("hidden");
        }

        // 🚀 API POST LÊN DATABASE
        async function submitPost() {
            const content = document.getElementById("postContent").value.trim();
            if(!content && !selectedMediaData) return showToast("Thêm chữ hoặc nhạc để đăng sếp ơi!", "error");

            const payload = {
                content: content,
                attached_media: selectedMediaData ? selectedMediaData.id : null,
                media_type: selectedMediaData ? (selectedMediaData.flags.video ? "video" : "audio") : null,
                media_url: selectedMediaData ? selectedMediaData.stream_url : null // Gửi kèm url để lưu bảng Media
            };

            try {
                const res = await fetch('/api/social/posts', { method: 'POST', headers: getApiHeaders(), body: JSON.stringify(payload) });
                if(res.ok) {
                    document.getElementById("postContent").value = ""; removeMedia(); showToast("Đăng bài thành công!"); loadFeed();
                } else showToast((await res.json()).detail, "error");
            } catch (e) { showToast("Mất kết nối mạng!", "error"); }
        }

        // 🚀 API DELETE BÀI VIẾT (Backend sẽ tự xử lý kiểm tra quyền)
        async function deletePost(postId) {
            if(!confirm("Sếp có chắc chắn muốn xóa bài này vĩnh viễn không?")) return;
            try {
                const res = await fetch(`/api/social/posts/${postId}`, { method: 'DELETE', headers: getApiHeaders() });
                if(res.ok) { showToast("Đã cho bay màu!"); loadFeed(); } else showToast((await res.json()).detail, "error");
            } catch (e) { showToast("Lỗi khi xóa bài!", "error"); }
        }

        // ===================================
        // 🔄 CUSTOM AUDIO PLAYER LOGIC
        // ===================================
        const globalPlayer = document.getElementById("globalAudioPlayer");
        window.toggleCustomPlay = function(postId, audioUrl) {
            const btnIcon = document.getElementById(`play-icon-${postId}`);
            const progressBar = document.getElementById(`progress-${postId}`);

            if (currentlyPlayingPostId !== null && currentlyPlayingPostId !== postId) {
                const oldIcon = document.getElementById(`play-icon-${currentlyPlayingPostId}`);
                if(oldIcon) oldIcon.className = "fa-solid fa-play ml-0.5";
            }

            if (currentlyPlayingPostId === postId && !globalPlayer.paused) {
                globalPlayer.pause(); btnIcon.className = "fa-solid fa-play ml-0.5";
            } else {
                if(globalPlayer.src !== audioUrl) globalPlayer.src = audioUrl;
                globalPlayer.play(); btnIcon.className = "fa-solid fa-pause"; currentlyPlayingPostId = postId;
                globalPlayer.ontimeupdate = () => { progressBar.style.width = `${(globalPlayer.currentTime / globalPlayer.duration) * 100}%`; };
                globalPlayer.onended = () => { btnIcon.className = "fa-solid fa-play ml-0.5"; progressBar.style.width = "0%"; currentlyPlayingPostId = null; };
            }
        }
        window.seekAudio = function(event, postId) {
            if (currentlyPlayingPostId !== postId) return;
            const rect = document.getElementById(`progress-container-${postId}`).getBoundingClientRect();
            globalPlayer.currentTime = (event.clientX - rect.left) / rect.width * globalPlayer.duration;
        }

        // ===================================
        // 📜 TẢI FEED TỪ DATABASE (RENDER GIAO DIỆN)
        // ===================================
        async function loadFeed() {
            const container = document.getElementById("feedContainer");
            try {
                const res = await fetch('/api/social/feed', { headers: getApiHeaders() });
                if(!res.ok) return;
                const result = await res.json();
                
                if(result.status === 'success') {
                    container.innerHTML = result.data.length === 0 ? "<div class='text-center text-gray-500 py-16 font-bold'>Bảng tin trống rỗng. Tới bến đi sếp!</div>" : "";
                    
                    result.data.forEach(post => {
                        const timeStr = formatTimeAgo(post.created_at);
                        
                        // 🛡️ Logic Rác: Backend cấm xóa nếu không phải chủ/admin, nhưng Frontend ẩn luôn nút cho gọn mắt
                        const isOwnerOrAdmin = (currentUser && (Number(currentUser.role) === 1 || post.user_id === currentUser.id));
                        const deleteBtnHtml = isOwnerOrAdmin ? `<button onclick="deletePost(${post.post_id})" class="delete-btn text-gray-600 hover:text-red-500 p-2"><i class="fa-solid fa-trash-can"></i></button>` : '';

                        let mediaHtml = "";
                        if(post.attached_media && post.stream_links) {
                            if(post.media_type === "video" && post.stream_links.video_url) {
                                mediaHtml = `<div class="mt-3 rounded-2xl overflow-hidden border border-white/10 relative bg-black"><video controls playsinline class="w-full max-h-[500px] object-cover"><source src="${post.stream_links.video_url}" type="video/mp4"></video></div>`;
                            } else if (post.media_type === "audio" && post.stream_links.vocal_url) {
                                mediaHtml = `<div class="mt-3 bg-gradient-to-r from-gray-900 to-black rounded-2xl border border-white/5 p-3 flex gap-3 items-center shadow-lg"><div class="w-14 h-14 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center flex-shrink-0 shadow-md"><i class="fa-solid fa-music text-white text-xl"></i></div><div class="flex-1 w-full"><div class="text-xs font-bold text-gray-100 mb-2 truncate">${post.attached_media}</div><div class="custom-audio-player"><div onclick="toggleCustomPlay(${post.post_id}, '${post.stream_links.vocal_url}')" class="play-btn flex-shrink-0"><i id="play-icon-${post.post_id}" class="fa-solid fa-play ml-0.5"></i></div><div id="progress-container-${post.post_id}" class="progress-bar-container" onclick="seekAudio(event, ${post.post_id})"><div id="progress-${post.post_id}" class="progress-bar"></div></div></div></div></div>`;
                            }
                        }

                        const formatContent = post.content ? `<div class="text-[14px] text-gray-100 leading-[1.6] whitespace-pre-wrap mt-2 mb-1 pl-[3.25rem]">${post.content}</div>` : '';

                        const postEl = document.createElement("div");
                        postEl.className = "post-card px-5 border-b border-white/10";
                        postEl.innerHTML = `
                            <div class="flex items-center justify-between mb-1 relative">
                                <div class="flex items-center gap-3 w-full">
                                    <div class="story-ring flex-shrink-0 w-11 h-11"><img src="${post.avatar_url || 'https://via.placeholder.com/150'}" class="w-full h-full rounded-full object-cover" onerror="this.src='https://via.placeholder.com/150'"></div>
                                    <div class="flex-1">
                                        <div class="flex items-center"><span class="font-bold text-[14px] text-gray-100 mr-1">${post.fullname}</span>${renderVerifiedBadge(post.role)}<span class="text-gray-500 mx-1.5">•</span><span class="text-gray-500 text-xs">${timeStr}</span></div>
                                        <div class="text-[11px] text-gray-500">@${post.username}</div>
                                    </div>
                                    ${deleteBtnHtml}
                                </div>
                            </div>
                            ${formatContent}
                            <div class="pl-[3.25rem] pr-2">${mediaHtml}</div>
                            <div class="flex items-center gap-6 mt-3 pl-[3.25rem] text-gray-400 text-[18px]">
                                <button class="hover:text-[#ff0050] transition hover:scale-110 active:scale-90"><i class="fa-regular fa-heart"></i></button>
                                <button class="hover:text-gray-300 transition hover:scale-110 active:scale-90"><i class="fa-regular fa-comment"></i></button>
                                <button class="hover:text-blue-400 transition hover:scale-110 active:scale-90 ml-auto"><i class="fa-regular fa-paper-plane"></i></button>
                            </div>
                        `;
                        container.appendChild(postEl);
                    });
                }
            } catch (e) {}
        }

        // Bắt đầu
        async function initApp() {
            if (checkAuthorization()) {
                await loadMusicLibrary();
            }
        }
        initApp();
