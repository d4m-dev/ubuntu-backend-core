<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S Terminal | D4M</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap');
        
        html, body { 
            margin: 0; padding: 0; 
            height: 100%; height: 100dvh; 
            background-color: #050505; color: #fff; 
            font-family: 'Inter', sans-serif; 
            display: flex; flex-direction: column; 
            overflow: hidden; 
        }
        
        .glass-panel { background: rgba(15, 15, 20, 0.95); border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 1.5rem; 
            display: flex; flex-direction: column; gap: 1.5rem; 
            scroll-behavior: smooth; 
        }
        .chat-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        
        .input-area { 
            flex-shrink: 0; 
            background: rgba(10, 10, 12, 0.95); 
            border-top: 1px solid rgba(255,255,255,0.1); 
            padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom)) 1rem; 
        }

        .msg-user { align-self: flex-end; background: #2563eb; color: white; padding: 0.8rem 1.2rem; border-radius: 20px 20px 0 20px; max-w: 85%; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); font-size: 14px;}
        .msg-ai { align-self: flex-start; background: #161b22; color: #e2e8f0; padding: 1rem 1.2rem; border-radius: 20px 20px 20px 0; max-w: 85%; border: 1px solid rgba(255,255,255,0.05); font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6; }
        
        .action-badge { margin-top: 0.75rem; display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); color: #4ade80; padding: 0.5rem 0.8rem; border-radius: 8px; font-size: 11px; font-family: 'Inter', sans-serif; font-weight: bold; }
        
        .typing-indicator { display: flex; gap: 4px; padding: 0.8rem 1.2rem; background: #161b22; border-radius: 20px 20px 20px 0; align-self: flex-start; border: 1px solid rgba(255,255,255,0.05); width: fit-content; }
        .dot { width: 6px; height: 6px; background: #4f46e5; border-radius: 50%; animation: blink 1.4s infinite both; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.2); } }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- 🛡️ LÁ CHẮN: TRẠNG THÁI KHÓA (CHƯA ĐĂNG NHẬP) -->
    <!-- ========================================== -->
    <div id="unauthorizedState" class="hidden flex-col items-center justify-center h-full text-center px-4 w-full relative z-20">
        <div class="w-24 h-24 bg-red-500/10 rounded-full flex items-center justify-center mb-6 border border-red-500/20 shadow-[0_0_30px_rgba(239,68,68,0.2)]">
            <i class="fa-solid fa-lock text-5xl text-red-400"></i>
        </div>
        <h2 id="unauthTitle" class="text-3xl font-black text-white mb-4 tracking-wide">Yêu Cầu Đăng Nhập</h2>
        <p id="unauthDesc" class="text-gray-400 mb-8 leading-relaxed">Sếp chưa mang thẻ định danh D4M ID.<br>Vui lòng đăng nhập vào hệ sinh thái để sử dụng công cụ này.</p>
        <button onclick="redirectToAuth()" class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-3.5 px-8 rounded-xl shadow-lg transition-all active:scale-95 flex items-center">
            <i class="fa-solid fa-fingerprint mr-2 text-lg"></i> Đăng nhập D4M ID
        </button>
    </div>

    <!-- ========================================== -->
    <!-- 🟢 TRẠNG THÁI MỞ KHÓA: ỨNG DỤNG J.A.R.V.I.S -->
    <!-- ========================================== -->
    <div id="appContent" class="hidden flex-col h-full w-full">
        <!-- Header -->
        <header class="glass-panel h-16 flex items-center justify-between px-6 shrink-0 z-10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-600/20 flex items-center justify-center border border-blue-500/30">
                    <i class="fa-solid fa-microchip text-blue-400"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-white tracking-wide">J.A.R.V.I.S Core</h1>
                    <p class="text-[10px] text-green-400 font-mono uppercase tracking-widest"><i class="fa-solid fa-circle text-[8px] animate-pulse mr-1"></i>System Online</p>
                </div>
            </div>
            <a href="/admin/omni" class="text-xs text-gray-400 hover:text-white transition"><i class="fa-solid fa-arrow-left mr-1"></i> Omni-Panel</a>
        </header>

        <!-- Khu vực Chat -->
        <div class="chat-container" id="chatBox">
            <div class="msg-ai shadow-lg shadow-blue-900/10 relative mt-4">
                <i class="fa-solid fa-robot absolute -left-4 -top-4 text-gray-500 bg-[#050505] rounded-full p-2 text-xl border border-gray-800"></i>
                Chào sếp <span id="userNameDisplay" class="text-blue-400 font-bold"></span>! Tôi là J.A.R.V.I.S. Sếp cần kiểm tra trạng thái hệ thống, bật/tắt dịch vụ hay sắp xếp lịch làm việc ngày hôm nay?
            </div>
        </div>

        <!-- Khung Nhập Liệu Ở Đáy -->
        <div class="input-area">
            <div class="max-w-4xl mx-auto relative flex items-center gap-2">
                <input type="text" id="chatInput" autocomplete="off" class="w-full bg-[#111] border border-gray-700 text-white rounded-2xl pl-5 pr-14 py-4 outline-none focus:border-blue-500 transition-colors shadow-inner font-mono text-sm" placeholder="Nhắn lệnh (VD: Tuần này làm ca A1)...">
                <button id="sendBtn" onclick="sendMessage()" class="absolute right-2 w-10 h-10 bg-blue-600 hover:bg-blue-500 text-white rounded-xl flex items-center justify-center transition-transform active:scale-90 shadow-lg shadow-blue-600/30">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        let validToken = "";

        // ==========================================
        // 🚀 KIỂM TRA QUYỀN TRUY CẬP (AUTH CHECKER CỦA SẾP)
        // ==========================================
        function redirectToAuth() {
            window.location.href = `/auth?redirect=${window.location.pathname}`;
        }

        // Hàm giải mã JWT Token để đọc chức vụ (Role) và Active
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        function checkAuthorization() {
            let token = localStorage.getItem('d4m_sso_token') || localStorage.getItem('token');
            const appContent = document.getElementById('appContent');
            const unauthorizedState = document.getElementById('unauthorizedState');
            const unauthTitle = document.getElementById('unauthTitle');
            const unauthDesc = document.getElementById('unauthDesc');

            // Hàm gom hiển thị màn hình khóa
            const showLock = (title, desc) => {
                if(unauthTitle && title) unauthTitle.innerText = title;
                if(unauthDesc && desc) unauthDesc.innerHTML = desc;
                unauthorizedState.classList.remove('hidden');
                unauthorizedState.classList.add('flex');
            };

            // 1. Nếu không có token -> Yêu cầu đăng nhập
            if (!token) {
                showLock("Cần Đăng Nhập", "Sếp chưa mang thẻ định danh D4M ID.<br>Vui lòng đăng nhập vào hệ sinh thái để tiếp tục.");
                return false;
            }

            // Loại bỏ ngoặc kép thừa để an toàn
            token = token.replace(/^["']|["']$/g, '');
            validToken = token; // Lưu lại để dùng cho hàm fetch()

            const payload = parseJwt(token);
            if (!payload) {
                showLock("Lỗi Định Danh", "Thẻ D4M ID của sếp bị hỏng hoặc đã hết hạn.<br>Vui lòng đăng xuất và đăng nhập lại.");
                return false;
            }

            // 🚀 2. ĐÂY LÀ CHỐT CHẶN ACTIVE
            if (Number(payload.active) !== 1) {
                showLock(
                    "Tài Khoản Bị Đóng Băng", 
                    "Tài khoản của sếp <b>chưa đăng ký</b>.<br>Vui lòng liên hệ Admin để kích hoạt tài khoản trước khi xài AI!"
                );
                return false;
            }

            // Hiển thị tên sếp lên giao diện chào hỏi
            const userName = payload.full_name || payload.sub || "Admin";
            const nameEl = document.getElementById('userNameDisplay');
            if (nameEl) nameEl.innerText = userName;

            // Vượt qua mọi chốt chặn -> Mở khóa giao diện AI
            appContent.classList.remove('hidden');
            appContent.classList.add('flex'); // Bật flexbox cho UI Chat
            return true;
        }

        // KÍCH HOẠT LÁ CHẮN NGAY KHI LOAD TRANG
        const isAuthorized = checkAuthorization();

        // ==========================================
        // 💬 LOGIC CHAT J.A.R.V.I.S (Chỉ chạy khi đã qua lá chắn)
        // ==========================================
        if (isAuthorized) {
            const chatBox = document.getElementById('chatBox');
            const chatInput = document.getElementById('chatInput');
            const sendBtn = document.getElementById('sendBtn');

            function scrollToBottom() { chatBox.scrollTop = chatBox.scrollHeight; }

            chatInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') sendMessage();
            });

            async function sendMessage() {
                const text = chatInput.value.trim();
                if(!text) return;

                chatInput.value = '';
                chatInput.disabled = true;
                sendBtn.disabled = true;
                
                chatBox.innerHTML += `<div class="msg-user mt-2">${text}</div>`;
                scrollToBottom();

                const typingId = 'typing-' + Date.now();
                chatBox.innerHTML += `
                    <div class="typing-indicator relative mt-4" id="${typingId}">
                        <i class="fa-solid fa-robot absolute -left-4 -top-4 text-gray-500 bg-[#050505] rounded-full p-2 text-xl border border-gray-800"></i>
                        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    </div>`;
                scrollToBottom();

                try {
                    const response = await fetch('/api/ai-admin/chat', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json', 
                            'Authorization': `Bearer ${validToken}` 
                        },
                        credentials: 'include',
                        body: JSON.stringify({ message: text })
                    });
                    
                    const data = await response.json();
                    document.getElementById(typingId).remove();

                    if(response.ok) {
                        let actionHtml = '';
                        if(data.action_executed) {
                            actionHtml = `<div class="block mt-3"><div class="action-badge"><i class="fa-solid fa-check-double"></i> ${data.action_executed}</div></div>`;
                        }
                        const formattedReply = data.reply.replace(/\n/g, '<br>');
                        
                        chatBox.innerHTML += `
                            <div class="msg-ai relative shadow-lg shadow-blue-900/10 mt-4">
                                <i class="fa-solid fa-robot absolute -left-4 -top-4 text-blue-500 bg-[#050505] rounded-full p-2 text-xl border border-blue-900 shadow-[0_0_10px_rgba(59,130,246,0.3)]"></i>
                                ${formattedReply}
                                ${actionHtml}
                            </div>`;
                    } else {
                        chatBox.innerHTML += `<div class="msg-ai border-red-500/50 text-red-400 mt-4">❌ Lỗi: ${data.detail}</div>`;
                    }
                } catch (err) {
                    document.getElementById(typingId).remove();
                    chatBox.innerHTML += `<div class="msg-ai border-red-500/50 text-red-400 mt-4">❌ Mất kết nối đến Lõi máy chủ.</div>`;
                }

                chatInput.disabled = false;
                sendBtn.disabled = false;
                chatInput.focus();
                scrollToBottom();
            }
        }
    </script>
</body>
</html>
